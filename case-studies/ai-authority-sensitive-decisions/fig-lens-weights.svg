<svg xmlns="http://www.w3.org/2000/svg" width="900" height="714" viewBox="0 0 900 714" role="img" font-family="Helvetica, Arial, sans-serif">
<title>Observer lens concept weights</title>
<desc>Key concepts from each of the five lenses, with weights from 0 to 1, as recorded in the Observer analysis of the draft.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
