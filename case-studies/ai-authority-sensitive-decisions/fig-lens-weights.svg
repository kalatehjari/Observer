<text x="330" y="97" font-size="12.5" text-anchor="end" fill="#1d2933">Internal consistency of Table 1 with the asymmetry rule</text>
<rect x="342" y="87" width="387.0" height="13" fill="#1F6FB2"/>
<text x="735.0" y="97" font-size="12" fill="#1d2933">0.90</text>
<text x="330" y="119" font-size="12.5" text-anchor="end" fill="#1d2933">Boundary between grades 2 and 3</text>
<rect x="342" y="109" width="301.0" height="13" fill="#1F6FB2"/>
<text x="649.0" y="119" font-size="12" fill="#1d2933">0.70</text>
<text x="330" y="141" font-size="12.5" text-anchor="end" fill="#1d2933">Verifiability of references</text>
<rect x="342" y="131" width="258.0" height="13" fill="#1F6FB2"/>
<text x="606.0" y="141" font-size="12" fill="#1d2933">0.60</text>
<text x="330" y="163" font-size="12.5" text-anchor="end" fill="#1d2933">Empirical support for the triage claim</text>
<rect x="342" y="153" width="215.0" height="13" fill="#1F6FB2"/>
<text x="563.0" y="163" font-size="12" fill="#1d2933">0.50</text>
<text x="330" y="185" font-size="12.5" text-anchor="end" fill="#1d2933">Balance of domain coverage</text>
<rect x="342" y="175" width="172.0" height="13" fill="#1F6FB2"/>
<text x="520.0" y="185" font-size="12" fill="#1d2933">0.40</text>
<text x="20" y="208" font-size="14" font-weight="bold" fill="#1d2933">Creative lens</text>
<text x="330" y="229" font-size="12.5" text-anchor="end" fill="#1d2933">Authority as separable permissions</text>
<rect x="342" y="219" width="365.5" height="13" fill="#1F6FB2"/>
<text x="713.5" y="229" font-size="12" fill="#1d2933">0.85</text>
