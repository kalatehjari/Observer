<text x="713.5" y="471" font-size="12" fill="#1d2933">0.85</text>
<text x="330" y="493" font-size="12.5" text-anchor="end" fill="#1d2933">Label loops from enforcement</text>
<rect x="342" y="483" width="301.0" height="13" fill="#1F6FB2"/>
<text x="649.0" y="493" font-size="12" fill="#1d2933">0.70</text>
<text x="330" y="515" font-size="12.5" text-anchor="end" fill="#1d2933">Detection delay for collective harms</text>
<rect x="342" y="505" width="258.0" height="13" fill="#1F6FB2"/>
<text x="606.0" y="515" font-size="12" fill="#1d2933">0.60</text>
<text x="330" y="537" font-size="12.5" text-anchor="end" fill="#1d2933">Deskilling loop with reviewer capacity</text>
<rect x="342" y="527" width="258.0" height="13" fill="#1F6FB2"/>
<text x="606.0" y="537" font-size="12" fill="#1d2933">0.60</text>
<text x="20" y="560" font-size="14" font-weight="bold" fill="#1d2933">Pragmatic lens</text>
<text x="330" y="581" font-size="12.5" text-anchor="end" fill="#1d2933">Operational tests for the five conditions</text>
<rect x="342" y="571" width="387.0" height="13" fill="#1F6FB2"/>
<text x="735.0" y="581" font-size="12" fill="#1d2933">0.90</text>
