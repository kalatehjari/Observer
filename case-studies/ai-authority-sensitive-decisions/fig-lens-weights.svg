<rect x="342" y="241" width="301.0" height="13" fill="#1F6FB2"/>
<text x="649.0" y="251" font-size="12" fill="#1d2933">0.70</text>
<text x="330" y="273" font-size="12.5" text-anchor="end" fill="#1d2933">Two-key rule for adverse acts</text>
<rect x="342" y="263" width="258.0" height="13" fill="#1F6FB2"/>
<text x="606.0" y="273" font-size="12" fill="#1d2933">0.60</text>
<text x="330" y="295" font-size="12.5" text-anchor="end" fill="#1d2933">Envelope protection for grade 3</text>
<rect x="342" y="285" width="215.0" height="13" fill="#1F6FB2"/>
<text x="563.0" y="295" font-size="12" fill="#1d2933">0.50</text>
<text x="20" y="318" font-size="14" font-weight="bold" fill="#1d2933">Critical lens</text>
<text x="330" y="339" font-size="12.5" text-anchor="end" fill="#1d2933">Unexamined asymmetry premise</text>
<rect x="342" y="329" width="387.0" height="13" fill="#1F6FB2"/>
<text x="735.0" y="339" font-size="12" fill="#1d2933">0.90</text>
<text x="330" y="361" font-size="12.5" text-anchor="end" fill="#1d2933">Unsourced claim in Section 6.1</text>
<rect x="342" y="351" width="301.0" height="13" fill="#1F6FB2"/>
<text x="649.0" y="361" font-size="12" fill="#1d2933">0.70</text>
<text x="330" y="383" font-size="12.5" text-anchor="end" fill="#1d2933">Envelope reliability under change</text>
<rect x="342" y="373" width="258.0" height="13" fill="#1F6FB2"/>
