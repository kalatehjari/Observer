<rect x="342" y="593" width="301.0" height="13" fill="#1F6FB2"/>
<text x="649.0" y="603" font-size="12" fill="#1d2933">0.70</text>
<text x="330" y="625" font-size="12.5" text-anchor="end" fill="#1d2933">Costs and reviewer capacity</text>
<rect x="342" y="615" width="258.0" height="13" fill="#1F6FB2"/>
<text x="606.0" y="625" font-size="12" fill="#1d2933">0.60</text>
<text x="330" y="647" font-size="12.5" text-anchor="end" fill="#1d2933">Existing legal hooks</text>
<rect x="342" y="637" width="258.0" height="13" fill="#1F6FB2"/>
<text x="606.0" y="647" font-size="12" fill="#1d2933">0.60</text>
<text x="20" y="700" font-size="11" fill="#5b6770">Weights are judgements made by the lens, not measurements. The same model produced all five lenses.</text>
</svg>